name: CI

on:
  push:
    branches:
      - main
      - develop  # Run on pushes to main and develop
  pull_request:
    branches:
      - main
      - develop  # Run on PRs targeting main and develop

jobs:
  build:
    # Changed to run on Linux (ubuntu-latest) as it's faster and more common for CI
    # If you specifically need Windows, change this back to windows-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Tests
        # Replace this with your actual test command (e.g., pytest)
        run: python --version